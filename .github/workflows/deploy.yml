name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Tommy-JOUHANS.github.io/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tommy-JOUHANS.github.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tommy-JOUHANS.github.io/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Check Railway URL
        run: |
          grep -R "tommy-jouhans-production.up.railway.app" dist
          if grep -R "127.0.0.1:8000" dist; then
            echo "Erreur : localhost présent dans le build"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Tommy-JOUHANS.github.io/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
